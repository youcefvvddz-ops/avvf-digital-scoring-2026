:root{--navy:#0b3d91;--blue:#1f6feb;--sky:#dbe8fb;--mist:#eef4fe;--line:#c9dbf5;--ink:#0b2a5b;--white:#fff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:18px}
body{font-family:"AVVF Naskh","Noto Naskh Arabic","Traditional Arabic","Geeza Pro",Tahoma,serif;background:#fff;color:var(--ink);line-height:1.6;min-height:100vh;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
.bar{height:8px;background:linear-gradient(90deg,var(--navy),#2f7be0)}
/* home */
.hero{display:flex;align-items:center;gap:14px;padding:22px 0 14px}
.hero img{width:64px;height:64px;flex:none}
.hero h1{font-size:1.7rem;color:var(--navy);font-weight:700;line-height:1.2}
.list{display:grid;gap:10px;padding:8px 0 24px}
.card{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:right;background:var(--mist);border:1.5px solid var(--line);border-radius:14px;padding:16px 16px;font-size:1.08rem;font-weight:700;color:var(--navy);cursor:pointer}
.card:active{background:var(--sky)}
.card i{font-style:normal;color:var(--blue);font-size:1.4rem;line-height:1}
/* sheet */
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
.top .in{display:flex;align-items:center;gap:10px;padding:10px 14px;max-width:640px;margin:0 auto}
.back{border:1.5px solid var(--navy);background:#fff;color:var(--navy);border-radius:10px;padding:5px 14px;font-weight:700;cursor:pointer;flex:none}
.top h2{font-size:1.02rem;color:var(--navy);font-weight:700;line-height:1.35}
.sec{border:1.5px solid var(--navy);border-radius:14px;overflow:hidden;margin:14px 0;background:#fff}
.sh{background:var(--sky);color:var(--navy);padding:12px 14px;font-weight:700;font-size:1.05rem;line-height:1.55;border-bottom:1.5px solid var(--navy)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--navy);color:#fff;padding:8px 14px;font-weight:700}
.meta .pts{font-size:1.1rem}
.meta .got{background:#fff;color:var(--navy);border-radius:8px;padding:0 12px;min-width:3.4rem;text-align:center;font-size:1.2rem}
.cap{display:flex;justify-content:space-between;font-size:.82rem;color:#5a7fb8;padding:6px 14px 0;font-weight:700}
.it{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.it:first-of-type{border-top:0}
.it .tx{font-weight:700;font-size:1.02rem;line-height:1.6;flex:1}
.it .sub{display:block;font-size:.85rem;color:var(--blue);font-weight:700}
.ctr{display:flex;align-items:center;gap:6px;flex:none;direction:ltr}
.ctr button{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);font-size:1.5rem;font-weight:700;line-height:1;cursor:pointer}
.ctr button.plus{background:var(--navy);color:#fff}
.ctr button:active{transform:scale(.94)}
.ctr .n{min-width:2.1rem;text-align:center;font-size:1.3rem;font-weight:700;color:var(--navy)}
.ctr .d{min-width:2.6rem;text-align:center;font-size:.9rem;font-weight:700;color:var(--blue)}
.it.col{flex-direction:column;align-items:stretch}
.multi{display:grid;gap:8px;width:100%}
.multi .row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.multi .lb{font-size:1rem;font-weight:700;color:var(--blue);min-width:4.6rem;text-align:right}
.notes{margin:14px 0}
.notes label{display:block;font-weight:700;color:var(--navy);margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;resize:vertical;font-size:1rem}
textarea:focus,input:focus{outline:2.5px solid var(--blue);outline-offset:1px}
.foot{position:fixed;inset:auto 0 0 0;z-index:6;background:var(--navy);color:#fff;padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.foot .in{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.foot .lab{font-weight:700;font-size:1.1rem}
.foot .tot{background:#fff;color:var(--navy);border-radius:12px;padding:0 18px;font-size:1.8rem;font-weight:700;min-width:5.2rem;text-align:center;line-height:1.5}
.foot button{background:transparent;border:1.5px solid rgba(255,255,255,.7);color:#fff;border-radius:10px;padding:5px 14px;font-weight:700;cursor:pointer}
/* scissor */
.legend{display:flex;gap:8px;padding:10px 14px 0;flex-wrap:wrap}
.legend span{background:var(--mist);border:1px solid var(--line);border-radius:8px;padding:0 10px;font-weight:700;color:var(--navy);font-size:.92rem}
.grp{padding:10px 14px 12px;border-top:1px solid var(--line)}
.grp:first-of-type{border-top:0}
.grp .gt{font-weight:700;color:var(--blue);margin-bottom:6px;font-size:.95rem}
.kicks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.k{border:1.5px solid var(--line);border-radius:12px;padding:6px;display:grid;gap:5px;background:var(--mist)}
.k button{height:38px;border-radius:9px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);font-weight:700;font-size:1.05rem;cursor:pointer}
.k button.on{background:var(--navy);color:#fff}
.sum{width:100%;border-collapse:collapse}
.sum td{padding:9px 14px;border-top:1px solid var(--line);font-weight:700}
.sum td:last-child{text-align:left;color:var(--navy);font-size:1.15rem}
.sum td.m{color:var(--blue)}
.num{display:flex;align-items:center;gap:6px;direction:ltr;justify-content:center;padding:12px 14px}
/* tie */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 4px}
.tabs button{padding:10px;border-radius:12px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);font-weight:700;cursor:pointer}
.tabs button.on{background:var(--navy);color:#fff}
.tw{overflow-x:auto;margin:12px 0;border:1.5px solid var(--navy);border-radius:14px}
table.t{border-collapse:collapse;width:100%;min-width:430px;text-align:center}
table.t th{background:var(--navy);color:#fff;padding:9px 4px;font-size:.95rem;white-space:nowrap}
table.t td{border-top:1px solid var(--line);border-left:1px solid var(--line);padding:5px 3px;font-weight:700;font-size:1.05rem}
table.t td.a{background:var(--sky);color:var(--navy)}
table.t input{width:46px;height:40px;text-align:center;border:1.5px solid var(--line);border-radius:8px;background:#fff;font-size:1rem;font-weight:700}
.hi{color:var(--blue);font-weight:700}
.u{border-bottom:3px solid var(--blue)}
.dr{color:#8aa4cf;text-decoration:line-through}
.mini{display:flex;gap:8px;margin:6px 0 20px}
.mini button{flex:1;padding:9px;border-radius:10px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);font-weight:700;cursor:pointer}
.ex h3{font-size:1.3rem;color:var(--blue);font-weight:700;margin:18px 0 6px}
.lc{font-weight:700;border-bottom:3px solid var(--navy);padding:0 4px}
.lc.r{color:var(--blue);border-color:var(--blue)}
.ck{display:inline-block;width:1.15em;height:1.15em;border-radius:5px;background:var(--blue);position:relative;vertical-align:middle;margin-inline-end:6px}
.ck:after{content:"";position:absolute;left:30%;top:14%;width:28%;height:52%;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.hint{font-size:.88rem;color:#5a7fb8;font-weight:700;margin:4px 2px}
@media (prefers-reduced-motion:no-preference){.ctr button{transition:transform .08s}}
</style>
</head>

 {t:"الجانب الفني والجمالي",max:10,ml:"10 نقاط",items:[S("أداء غير مقنع وغير جذاب -2ن",2)]}]},
{id:"solo",title:"ورقة التنقيط التقنيات الفردية (الكوين)",cap:"الانذرات",notes:"ملاحظات الحكم",secs:[
 {t:"النقاط التقنية : الكفاءة – دقة الحركة – الاتجاه الصحيح",max:50,ml:"50 نقطة",items:[S("أداء خاطئ للحركة ناقص-2 ن كل مرة",2),S("عدم اتمام التقنية في نفس المكان – 2ن",2),S("تردد وارتباك في أداء الحركات -2ن كل مرة",2),S("نسيان الحركة/خطا فادح -5ن",5),
   {t:"ملامسة السلاح للجسم بشكل طفيف 2 كل مرة / بشكل قوي 5 كل مرة",multi:[{l:"طفيف 2",p:2},{l:"قوي 5",p:5}]},S("افلات السلاح من يد الرياضي دون السقوط على الارض ناقص 5",5)]},
 {t:"مزج التقنيات : السرعة - القوة – المداومة",max:20,ml:"20 نقطة",items:[S("ثقل في تنفيذ التقنيات اداء بطيئ 2 نقطة كل مرة---",2),S("حركة تفتقر الى القوة او الحيوية 2 نقطة كل مرة",2),S("ظهور علامات التعب 2ن",2)]},
 {t:"الوضعيات : الدقة , توازن",max:10,ml:"10 نقطة",items:[S("الوضعية خاطئة -1ن كل مرة",1),S("اختلال التوازن-2ن كل مرة",2)]},
 {t:"المرونة والايقاع",max:10,ml:"10 نقطة",items:[{t:"نقص في المرونة و الايقاع-من ناقص 1 الى ناقص 5 كحد اقصى",range:5}]},
 {t:"الجانب الفني والجمالي",max:10,ml:"10 نقطة",items:[S("أداء غير مقنع وغير جذاب قلة العزم -2ن",2)]}]},
{id:"scissor",title:"ورقة التنقيط الضربات المقصية",kind:"scissor",notes:"ملاحظة الحكم"},
{id:"tie",title:"أمثلة عن النتائج الخاصة بالتقني في حالة التعادل",kind:"tie"}
];
/* أمثلة التعادل (كما في الصفحة الأصلية): [الرياضي,[ح1..ح5],المجموع,الترتيب,الرقم الجانبي,جانبي أزرق؟,ح1 مسطر,ح5 مسطر,علامة] */
const EX=[
["المثال الاول",[["01",[94,91,89,90,88],270,"01","452",1,1,1,0],["02",[93,91,89,90,88],270,"01","451",1,0,1,0],["03",[92,90,89,90,88],269,"03","449",0,0,0,0],["04",[92,89,89,90,88],268,"04","448",0,0,0,0],["05",[92,88,90,90,88],267,"05","447",0,0,0,0]]],
["المثال الثاني",[["01",[94,91,89,90,87],270,"01","251",1,1,1,1],["02",[93,91,89,90,88],270,"01","451",1,0,1,0],["03",[92,90,89,90,88],269,"03","449",0,0,0,0],["04",[92,89,89,90,88],268,"04","448",0,0,0,0],["05",[92,88,89,90,88],267,"05","447",0,0,0,0]]],
["المثال الثالث",[["01",[93,91,89,90,88],270,"01","251",1,0,1,0],["02",[93,91,89,90,88],270,"01","451",1,0,1,0],["03",[92,90,89,90,88],269,"03","449",0,0,0,0],["04",[92,89,89,90,88],268,"04","448",0,0,0,0],["05",[92,88,89,90,88],267,"05","447",0,0,0,0]]],
["المثال الرابع",[["01",[92,92,89,90,88],271,"01","451",0,0,1,0],["02",[92,91,89,90,88],270,"02","450",0,0,1,0],["03",[92,90,89,90,88],269,"03","449",0,0,0,0],["04",[92,89,89,90,88],268,"04","448",1,0,0,0],["05",[92,89,89,90,88],268,"04","448",1,0,0,0]]]
];
/* ---------- الحالة والتخزين على الهاتف فقط ---------- */
const KEY="avvf_scoring_sheets_v1";
let ST={};
try{ST=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){ST={}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const get=id=>ST[id]||(ST[id]={c:{},note:"",k:[],aes:0});
/* ---------- الصفحة الرئيسية ---------- */
function home(){
 document.title="أوراق التنقيط";
 $("#app").innerHTML=`<div class="bar"></div><div class="wrap"><div class="hero"><img src="${LOGO}" alt=""><h1>أوراق التنقيط</h1></div><div class="list">${SHEETS.map(s=>`<button class="card" onclick="location.hash='${s.id}'"><span>${esc(s.title)}</span><i>‹</i></button>`).join("")}</div></div>`;
 window.scrollTo(0,0);
}
const topbar=s=>`<div class="top"><div class="in"><button class="back" onclick="location.hash=''">الرئيسية</button><h2>${esc(s.title)}</h2></div></div>`;
/* ---------- أوراق الخصم ---------- */
function secScore(s,si,st){let d=0;s.secs[si].items.forEach((it,ii)=>{const k=si+"_"+ii;if(it.multi)it.multi.forEach((m,mi)=>d+=(st.c[k+"_"+mi]||0)*m.p);else d+=(st.c[k]||0)*(it.range?1:it.p)});return Math.max(0,s.secs[si].max-d)}
function sheet(s){
 const st=get(s.id);
 const ctr=(k,step,lim)=>`<div class="ctr"><button aria-label="نقصان" onclick="bump('${s.id}','${k}',-1,${lim||999})">−</button><span class="n" id="n_${k}">${st.c[k]||0}</span><button class="plus" aria-label="زيادة" onclick="bump('${s.id}','${k}',1,${lim||999})">+</button></div>`;
 let h=`<div class="bar"></div>${topbar(s)}<div class="wrap">`;
 s.secs.forEach((sec,si)=>{
  h+=`<section class="sec"><div class="sh">${esc(sec.t)}</div><div class="meta"><span class="pts">${sec.ml}</span><span>مجموع النقاط <span class="got" id="sc_${si}">${secScore(s,si,st)}</span></span></div><div class="cap"><span>محتوى</span><span>${s.cap}</span></div>`;
  sec.items.forEach((it,ii)=>{
   const k=si+"_"+ii;
   if(it.multi){
    h+=`<div class="it col"><div class="tx">${esc(it.t)}</div><div class="multi">${it.multi.map((m,mi)=>`<div class="row"><span class="lb">${m.l}</span>${ctr(k+"_"+mi)}</div>`).join("")}</div></div>`;
   }else if(it.range){
    h+=`<div class="it"><div class="tx">${esc(it.t)}<span class="sub">من 1 إلى ${it.range} (خصم)</span></div>${ctr(k,1,it.range)}</div>`;
   }else{
    h+=`<div class="it"><div class="tx">${esc(it.t)}</div>${ctr(k)}</div>`;
   }
  });
  h+=`</section>`;
 });
 if(s.notes)h+=`<div class="notes"><label for="note">${s.notes}</label><textarea id="note" oninput="setNote('${s.id}',this.value)">${esc(st.note||"")}</textarea></div>`;
 h+=`</div><div class="foot"><div class="in"><span class="lab">المجموع الكلي</span><span class="tot" id="total">0</span><button onclick="resetSheet('${s.id}')">تصفير</button></div></div>`;
 $("#app").innerHTML=h;document.title=s.title;window.scrollTo(0,0);refresh(s);
}
function refresh(s){
 const st=get(s.id);let t=0;
 s.secs.forEach((sec,si)=>{const v=secScore(s,si,st);t+=v;const e=$("#sc_"+si);if(e)e.textContent=v});
 $("#total").textContent=t;
}
function bump(id,k,d,lim){
 const s=SHEETS.find(x=>x.id===id),st=get(id);
 st.c[k]=Math.max(0,Math.min(lim,(st.c[k]||0)+d));
 const e=$("#n_"+k);if(e)e.textContent=st.c[k];
 save();refresh(s);
}
function setNote(id,v){get(id).note=v;save()}
function resetSheet(id){if(!confirm("تصفير هذه الورقة؟"))return;ST[id]={c:{},note:"",k:[],aes:0};save();route()}
/* ---------- ورقة الضربات المقصية ---------- */
function scissor(s){
 const st=get(s.id);
 let h=`<div class="bar"></div>${topbar(s)}<div class="wrap"><section class="sec"><div class="sh">04 منافسين يؤدي كل واحد منهم 4 ضربات مقصية</div><div class="meta"><span class="pts">التقنيات 80 نقطة</span><span>النقاط <span class="got" id="techsum">0</span></span></div><div class="legend"><span>5 نقاط</span><span>3 نقاط</span><span>2 نقطة</span></div>`;
 for(let g=0;g<4;g++){
  h+=`<div class="grp"><div class="gt">منافس ${g+1}</div><div class="kicks">`;
  for(let q=0;q<4;q++){const i=g*4+q;h+=`<div class="k">${[5,3,2].map(v=>`<button id="k${i}_${v}" onclick="kick(${i},${v})">${v}</button>`).join("")}</div>`}
  h+=`</div></div>`;
 }
 h+=`<table class="sum"><tr><td>5 نقاط</td><td class="m" id="c5">0</td><td id="p5">0</td></tr><tr><td>3 نقاط</td><td class="m" id="c3">0</td><td id="p3">0</td></tr><tr><td>2 نقطة</td><td class="m" id="c2">0</td><td id="p2">0</td></tr></table></section>`;
 h+=`<section class="sec"><div class="sh">الجانب الفني والجمالي 20 نقطة</div><div class="num"><div class="ctr"><button onclick="aes(-1)">−</button><span class="n" id="aes">0</span><button class="plus" onclick="aes(1)">+</button></div></div></section>`;
 if(s.notes)h+=`<div class="notes"><label for="note">${s.notes}</label><textarea id="note" oninput="setNote('${s.id}',this.value)">${esc(st.note||"")}</textarea></div>`;
 h+=`</div><div class="foot"><div class="in"><span class="lab">المجموع الكلي</span><span class="tot" id="total">0</span><button onclick="resetSheet('${s.id}')">تصفير</button></div></div>`;
 $("#app").innerHTML=h;document.title=s.title;window.scrollTo(0,0);scrRefresh();
}
function kick(i,v){const st=get("scissor");st.k[i]=st.k[i]===v?0:v;save();scrRefresh()}
function aes(d){const st=get("scissor");st.aes=Math.max(0,Math.min(20,(st.aes||0)+d));save();scrRefresh()}
function scrRefresh(){
 const st=get("scissor");let tot=0,cnt={5:0,3:0,2:0};
 for(let i=0;i<16;i++){const v=st.k[i]||0;[5,3,2].forEach(x=>{const b=$("#k"+i+"_"+x);if(b)b.classList.toggle("on",v===x)});if(v){cnt[v]++;tot+=v}}
 [5,3,2].forEach(x=>{$("#c"+x).textContent=cnt[x];$("#p"+x).textContent=cnt[x]*x});
 $("#techsum").textContent=tot;$("#aes").textContent=st.aes||0;$("#total").textContent=tot+(st.aes||0);
}
/* ---------- التعادل: أمثلة + حاسبة ---------- */
function tie(s){
 const tab=ST._tab||"ex";
 let h=`<div class="bar"></div>${topbar(s)}<div class="wrap"><div class="tabs"><button class="${tab==="ex"?"on":""}" onclick="setTab('ex')">الأمثلة</button><button class="${tab==="calc"?"on":""}" onclick="setTab('calc')">حاسبة</button></div>`;
 if(tab==="ex"){
  h+=`<div class="ex">`;
  EX.forEach(([t,rows])=>{
   h+=`<h3>${t}</h3><div class="tw"><table class="t"><tr><th></th><th>الرياضي</th><th>الحكم 1</th><th>الحكم 2</th><th>الحكم 3</th><th>الحكم 4</th><th>الحكم 5</th><th>المجموع</th><th>الترتيب</th></tr>`;
   rows.forEach(r=>{
    const j=r[1],ck=r[8]?'<i class="ck"></i>':'';
    h+=`<tr><td><span class="lc ${r[5]?"r":""}">${r[4]}</span></td><td class="a">${r[0]}</td><td class="hi">${ck}<span class="${r[6]?"u":""}">${j[0]}</span></td><td>${j[1]}</td><td>${j[2]}</td><td>${j[3]}</td><td class="hi"><span class="${r[7]?"u":""}">${j[4]}</span></td><td>${r[2]}</td><td>${r[3]}</td></tr>`;
   });
   h+=`</table></div>`;
  });
  h+=`</div>`;
 }else{
  const c=ST._calc||(ST._calc=Array.from({length:5},()=>["","","","",""]));
  h+=`<p class="hint">أدخل علامات الحكام الخمسة لكل رياضي. تُحذف أعلى علامة وأدنى علامة ويُجمع الباقي.</p><div class="tw"><table class="t"><tr><th>الرياضي</th><th>الحكم 1</th><th>الحكم 2</th><th>الحكم 3</th><th>الحكم 4</th><th>الحكم 5</th><th>المجموع</th><th>الترتيب</th><th>الكل</th></tr>`;
  c.forEach((r,ri)=>{
   h+=`<tr><td class="a">${String(ri+1).padStart(2,"0")}</td>${r.map((v,ji)=>`<td><input inputmode="decimal" value="${v}" oninput="calcIn(${ri},${ji},this.value)" aria-label="الحكم ${ji+1}"></td>`).join("")}<td id="cm${ri}"></td><td id="cr${ri}"></td><td id="ca${ri}"></td></tr>`;
  });
  h+=`</table></div><div class="mini"><button onclick="calcAdd()">إضافة رياضي</button><button onclick="calcClear()">تصفير</button></div><p class="hint">«الكل» هو مجموع علامات الحكام الخمسة. عند التساوي في المجموع يتساوى الترتيب.</p>`;
 }
 h+=`</div>`;$("#app").innerHTML=h;document.title=s.title;window.scrollTo(0,0);if(tab==="calc")calcRefresh();
}
function setTab(t){ST._tab=t;save();route()}
function calcIn(r,j,v){ST._calc[r][j]=v;save();calcRefresh()}
function calcAdd(){if(ST._calc.length<12){ST._calc.push(["","","","",""]);save();route()}}
function calcClear(){ST._calc=Array.from({length:5},()=>["","","","",""]);save();route()}
function calcRefresh(){
 const c=ST._calc,res=c.map(r=>{const n=r.map(x=>parseFloat(String(x).replace(",",".")));if(n.some(isNaN))return null;const s=[...n].sort((a,b)=>a-b);return{mid:s[1]+s[2]+s[3],all:n.reduce((a,b)=>a+b,0)}});
 const f=x=>Math.round(x*100)/100;
 c.forEach((r,i)=>{const o=res[i];$("#cm"+i).textContent=o?f(o.mid):"";$("#ca"+i).textContent=o?f(o.all):"";$("#cr"+i).textContent=o?String(1+res.filter(p=>p&&p.mid>o.mid).length).padStart(2,"0"):""});
}
/* ---------- التوجيه ---------- */
function route(){
 const id=location.hash.replace("#","");const s=SHEETS.find(x=>x.id===id);
 if(!s)return home();
 if(s.kind==="scissor")return scissor(s);
 if(s.kind==="tie")return tie(s);
 sheet(s);
}
window.addEventListener("hashchange",route);route();
</script>
